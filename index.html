<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mono-Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <h1>Mono-Notes</h1>

            <input type="text" id="search-input" placeholder="Search notes..." />

            <button class="btn" id="newNoteBtn">+ New Note</button>

            <ul class="notes-list"></ul>
        </aside>

        <!-- RIGHT EDITOR -->
        <main class="editor">
            <input type="text" id="note-title" placeholder="Title..." />

            <div class="toolbar">
                <button class="toolbar-btn" onclick="formatText('bold')"><b>B</b></button>
                <button class="toolbar-btn" onclick="formatText('italic')"><i>I</i></button>
                <button class="toolbar-btn" onclick="formatText('underline')"><u>U</u></button>
            </div>

            <div id="note-content" class="content">
                <div class="input-box" contenteditable="true"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
